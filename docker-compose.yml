version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      tags:
        - juliusdelapena1984/inc-attendance-monitor-web:v0.001-prototype
        - juliusdelapena1984/inc-attendance-monitor-web:latest
    ports:
      - "80:80" # Expose web on host port 80
    depends_on:
      - express-server # web depends on Express server for API calls during development
    networks:
      - my_app_network # Ensure they are on the same network
    restart: always

  express-server:
    build:
      context: ./express-server
      dockerfile: Dockerfile
      tags:
        - juliusdelapena1984/inc-attendance-monitor-express-server:v0.001-prototype
        - juliusdelapena1984/inc-attendance-monitor-express-server:latest
    ports:
      - "3001:3001" # Express server port
    depends_on:
      - data-service # Express server depends on Python api
    networks:
      - my_app_network # Ensure they are on the same network
    restart: always

  data-service:
    build:
      context: ./api
      dockerfile: Dockerfile
      tags:
        - juliusdelapena1984/inc-attendance-monitor-data-service:v0.001-prototype
        - juliusdelapena1984/inc-attendance-monitor-data-service:latest
    ports:
      - "5000:5000" # Python api port
    networks:
      - my_app_network # Ensure they are on the same network
    restart: always

